name: Node.js CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x] # Các phiên bản Node.js sẽ chạy test

    steps:
    - name: Lấy mã nguồn (Checkout code)
      uses: actions/checkout@v4

    - name: Cài đặt Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Cài đặt các gói phụ thuộc (Install dependencies)
      run: npm ci

    - name: Chạy Unit Test (Run Jest)
      run: npm test
